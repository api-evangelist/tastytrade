openapi: 3.2.0
info:
  title: Symbol Search Symbols API
  version: 1.0.0
servers:
- url: https://api.tastyworks.com
tags:
- name: Symbols
paths:
  /symbols/search/{symbol}:
    get:
      description: Returns an array of symbol data.
      responses:
        '200':
          description: Returns an array of symbol data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolData'
      parameters:
      - in: path
        name: symbol
        required: true
        description: Symbol or fragment of a symbol to search, i.e. `AAP` will return AAP and AAPL data
        schema:
          type: string
      operationId: searchSymbols
      tags:
      - Symbols
      summary: Search symbols
      x-summary-source: derived
components:
  schemas:
    SymbolData:
      type: object
      properties:
        symbol:
          type: string
          description: Symbol
        description:
          type: string
          description: Company name
        listed-market:
          type: string
          description: Listed Market
        price-increments:
          type: string
          description: Price Increments
        trading-hours:
          type: string
          description: Trading Hours
        options:
          type: boolean
          description: Has listed options
        instrument-type:
          type: string
          description: Instrument Type
